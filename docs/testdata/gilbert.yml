version: 2

#include:
#  - include.yml

plugins:
  githubMod: github://go-gilbert/example-plugin@v1.0.0
  httpMod: http://example.com/plugin.zip
  localMod: ./my-plugin

const:
  foo: bar

inputs:
  # Inputs are set of global input parameters.
  # Inputs automatically bind to command-line flags, but can also be populated from environment.

  # Is build a production release or not
  release:
    default: false
    type: bool
  # Some timeout value
  timeout:
    type: duration
    default: 10s
    binding:
      env: JOB_TIMEOUT
  timestamp:
    type: date
    optional: true
    dateFormat: "2006-01-02 15:04:05"
  # items:
  #   type: list
  #   items:
  #     type: int

tasks:
  # Task to debug task runner
  test:
    steps:
      - action: debug/signal
        with:
          signal: value

  # Build builds application
  build:
    inputs:
      # App version
      version:
        type: string
        default: $(git describe --tags --abbrev=0)
    steps:
      - action: go/build
        if: ${{inputs.version != "invalid"}}
        timeout: 30s
        continue-on-error: false
        strategy:
          max-parallel: 2
          matrix:
            os: [windows, linux, darwin]
            arch: [amd64, 386, arm64]
          exclude:
            - os: darwin
              arch: 386
            - arch: amd64
              os: darwin
        with:
          package: .
          os: ${{matrix.os}}
          arch: ${{matrix.arch}}
          cgo: false
          buildvcs: false
          tags:
            - '${{inputs.release ? "release" : "debug"}}'
          package_vars:
            "github.com/go-gilbert/gilbert/internal/build.Version": "${{inputs.version}}"
            "github.com/go-gilbert/gilbert/internal/build.Channel": "stable"
          env:
            foo: bar

  # Starts dev server.
  #
  # Detailed description comes here.
  start:
    inputs:
      configFile:
        type: string
        default: "dev.env"
    steps:
      - action: fs/watch
        delay: 1s
        async: true
        with:
          path: "./..."
          debounceTime: 100ms
          ignore:
            - "*.log"
        on:
          change:
            - action: go/run
              async: true
              with:
                package: .
                args: "-cfg=${{ inputs.configFile }}"
