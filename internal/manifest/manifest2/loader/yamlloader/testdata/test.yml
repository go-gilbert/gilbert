version: 2
#include:
#  - foo
#  - bar/baz
#  - test.yml

const:
  foo: bar

inputs:
  release:
    default: false
    type: bool
  timeout:
    type: string
    format: duration
    default: 10s
    binding:
      env: JOB_TIMEOUT
  timestamp:
    type: string
    format: date
    dateFormat: "Mon, 02 Jan 2006 15:04:05 MST"
  items:
    type: list
    items:
      type: string
      format: date

tasks:
  # Build builds application
  build:
    - action: go/build
      if: ${!matrix.os == "darwin" && matrix.arch == "386"}
      strategy:
        delay: 5s
        deadline: 30s
        matrix:
          os: [windows, linux, darwin]
          arch: [amd64, 386, arm64]
      with:
        package: .
        os: ${matrix.os}
        arch: ${matrix.arch}
        cgo: false
        tags:
          - ${if(inputs.release, "release", "debug")}
