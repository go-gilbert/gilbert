version: 2
#include:
#  - foo
#  - bar/baz
#  - test.yml

plugins:
  githubMod: github://go-gilbert/example-plugin@v1.0.0
  httpMod: http://example.com/plugin.zip
  localMod: ./my-plugin

const:
  foo: bar

inputs:
  # Inputs are set of global input parameters.
  # Inputs automatically bind to command-line flags, but can also be populated from environment.

  # Is build a production release or not
  release:
    default: false
    type: bool
  # Job build timeout
  timeout:
    type: string
    format: duration
    default: 10s
    binding:
      env: JOB_TIMEOUT
  timestamp:
    type: string
    format: date
    dateFormat: "Mon, 02 Jan 2006 15:04:05 MST"
  items:
    type: list
    items:
      type: string
      format: date

tasks:
  test:
    steps:
      - action: githubMod/actionName
        with:
          key: value

  # Build builds application
  build:
    inputs:
      # App version
      version:
        type: string
        default: $(git describe --tags --abbrev=0)
    steps:
      - action: go/build
        if: ${!(matrix.os == "darwin" && matrix.arch == "386")}
        delay: 5s
        deadline: 30s
        strategy:
          matrix:
            os: [windows, linux, darwin]
            arch: [amd64, 386, arm64]
        with:
          package: .
          os: ${matrix.os}
          arch: ${matrix.arch}
          cgo: false
          tags:
            - ${if(inputs.release, "release", "debug")}
  start:
    inputs:
      configFile:
        type: string
        default: "dev.env"
    steps:
      - action: fs/watch
        async: true
        with:
          path: "./..."
          debounceTime: 100ms
          ignore:
            - "*.log"
        on:
          change:
            - action: go/run
              async: true
              with:
                package: .
                args: "-cfg=${inputs.configFile}"
