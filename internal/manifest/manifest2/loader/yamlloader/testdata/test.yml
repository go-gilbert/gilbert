version: 2
include:
  - foo
  - bar/baz

const:
  foo: bar

inputs:
  release:
    type: boolean
    default: false

tasks:
  # Build builds application
  build:
    - action: go/build
      if: ${!matrix.os == "darwin" && matrix.arch == "386"}
      strategy:
        delay: 5s
        deadline: 30s
        matrix:
          os: [windows, linux, darwin]
          arch: [amd64, 386, arm64]
      with:
        package: .
        os: ${matrix.os}
        arch: ${matrix.arch}
        cgo: false
        tags:
          - ${if(inputs.release, "release", "debug")}
