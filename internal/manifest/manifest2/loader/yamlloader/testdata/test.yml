version: 2
include:
  - foo
  - bar/baz

const:
  foo: bar

inputs:
  release:
    type: bool
    default: false
  timeout:
    type: string
    format: duration
    default: 10s
    binding:
      env: JOB_TIMEOUT
  items:
    type: list
    items:
      type: string
      format: date

tasks:
  # Build builds application
  build:
    - action: go/build
      if: ${!matrix.os == "darwin" && matrix.arch == "386"}
      strategy:
        delay: 5s
        deadline: 30s
        matrix:
          os: [windows, linux, darwin]
          arch: [amd64, 386, arm64]
      with:
        package: .
        os: ${matrix.os}
        arch: ${matrix.arch}
        cgo: false
        tags:
          - ${if(inputs.release, "release", "debug")}
