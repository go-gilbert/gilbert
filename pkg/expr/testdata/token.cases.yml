cases:
  simple-string:
    keepEOL: true
    tokens:
      - type: String
        content: foobar
        offset: 0
        range: '1:1-1:6'
      - type: EOL
        offset: 6
        rawContent: '\n'
        range: '2:0-2:0'
  multi-line-string:
    tokens:
      - type: String
        content: 'foo'
        offset: 0
        range: '1:1-1:3'
      - type: EOL
        rawContent: '\n'
        offset: 3
        range: '2:0-2:0'
      - type: String
        offset: 4
        content: 'bar'
        range: '2:1-2:3'
  multi-line-string-with-eol:
    tokens:
      - type: String
        content: foo
        offset: 0
        range: '1:1-1:3'
      - type: EOL
        rawContent: '\n\n'
        offset: 3
        range: '2:0-3:0'
      - type: String
        content: bar
        offset: 5
        range: '3:1-3:3'
  single-expr:
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 0
        range: '1:1-1:3'
      - type: String
        content: ' 2 + 2 '
        offset: 3
        range: '1:4-1:10'
      - type: EvalEnd
        content: '}}'
        offset: 10
        range: '1:11-1:12'
  single-shell-expr:
    tokens:
      - type: ShellStart
        content: '$('
        offset: 0
        range: '1:1-1:2'
      - type: String
        content: 'ls -la /'
        offset: 2
        range: '1:3-1:10'
      - type: ShellEnd
        content: ')'
        offset: 10
        range: '1:11-1:11'
  shell-expr-with-doc:
    source: single-shell-expr
    doc:
      fileName: shell-expr-with-doc
      byteOffset: 100
      startPosition:
        line: 30
        column: 10
    tokens:
      - type: ShellStart
        content: '$('
        offset: 100
        range: '30:11-30:12'
      - type: String
        content: 'ls -la /'
        offset: 102
        range: '30:13-30:20'
      - type: ShellEnd
        content: ')'
        offset: 110
        range: '30:21-30:21'
  string+shell:
    tokens:
      - type: String
        content: 'hello '
        offset: 0
        range: '1:1-1:6'
      - type: ShellStart
        content: '$('
        offset: 6
        range: '1:7-1:8'
      - type: String
        content: 'whoami'
        offset: 8
        range: '1:9-1:14'
      - type: ShellEnd
        content: ')'
        offset: 14
        range: '1:15-1:15'
  string+eval:
    tokens:
      - type: String
        content: 'hello '
        offset: 0
        range: '1:1-1:6'
      - type: EvalStart
        content: '${{'
        offset: 6
        range: '1:7-1:9'
      - type: String
        content: ' 2 / 0 '
        offset: 9
        range: '1:10-1:16'
      - type: EvalEnd
        content: '}}'
        offset: 16
        range: '1:17-1:18'
  eval+shell:
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 0
        range: '1:1-1:3'
      - type: String
        content: ' a '
        offset: 3
        range: '1:4-1:6'
      - type: EvalEnd
        content: '}}'
        offset: 6
        range: '1:7-1:8'
      - type: ShellStart
        content: '$('
        offset: 8
        range: '1:9-1:10'
      - type: String
        content: 'b'
        offset: 10
        range: '1:11-1:11'
      - type: ShellEnd
        content: ')'
        offset: 11
        range: '1:12-1:12'
  eval+shell+eval:
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 0
        range: '1:1-1:3'
      - type: String
        content: ' a '
        offset: 3
        range: '1:4-1:6'
      - type: EvalEnd
        content: '}}'
        offset: 6
        range: '1:7-1:8'
      - type: ShellStart
        content: '$('
        offset: 8
        range: '1:9-1:10'
      - type: String
        content: 'b'
        offset: 10
        range: '1:11-1:11'
      - type: ShellEnd
        content: ')'
        offset: 11
        range: '1:12-1:12'
      - type: EvalStart
        content: '${{'
        offset: 12
        range: '1:13-1:15'
      - type: String
        content: 'c'
        offset: 15
        range: '1:16-1:16'
      - type: EvalEnd
        content: '}}'
        offset: 16
        range: '1:17-1:18'
  string+eval+string:
    tokens:
      - type: String
        content: 'foo '
        offset: 0
        range: '1:1-1:4'
      - type: EvalStart
        content: '${{'
        offset: 4
        range: '1:5-1:7'
      - type: String
        content: 'bar'
        offset: 7
        range: '1:8-1:10'
      - type: EvalEnd
        content: '}}'
        offset: 10
        range: '1:11-1:12'
      - type: String
        content: ' baz'
        offset: 12
        range: '1:13-1:16'
  eval+str:
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 0
        range: '1:1-1:3'
      - type: String
        content: '2+2'
        offset: 3
        range: '1:4-1:6'
      - type: EvalEnd
        content: '}}'
        offset: 6
        range: '1:7-1:8'
      - type: String
        content: ' foobar'
        offset: 8
        range: '1:9-1:15'
  eval+lf+str:
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 0
        range: '1:1-1:3'
      - type: String
        content: '2+2'
        offset: 3
        range: '1:4-1:6'
      - type: EvalEnd
        content: '}}'
        offset: 6
        range: '1:7-1:8'
      - type: EOL
        rawContent: '\n'
        offset: 8
        range: '2:0-2:0'
      - type: String
        unescapeContent: true
        content: 'foobar'
        offset: 9
        range: '2:1-2:6'
  expr-in-shell:
    tokens:
      - type: ShellStart
        content: '$('
        offset: 0
        range: '1:1-1:2'
      - type: EvalStart
        content: '${{'
        offset: 2
        range: '1:3-1:5'
      - type: String
        content: 'msg'
        offset: 5
        range: '1:6-1:8'
      - type: EvalEnd
        content: '}}'
        offset: 8
        range: '1:9-1:10'
      - type: ShellEnd
        content: ')'
        offset: 10
        range: '1:11-1:11'
  expr+str-in-shell:
    tokens:
      - type: ShellStart
        content: '$('
        offset: 0
        range: '1:1-1:2'
      - type: EvalStart
        content: '${{'
        offset: 2
        range: '1:3-1:5'
      - type: String
        content: 'msg'
        offset: 5
        range: '1:6-1:8'
      - type: EvalEnd
        content: '}}'
        offset: 8
        range: '1:9-1:10'
      - type: String
        content: ' bar'
        offset: 10
        range: '1:11-1:14'
      - type: ShellEnd
        content: ')'
        offset: 14
        range: '1:15-1:15'
  expr-allow-braces:
    doc:
      fileName: err-allow-braces
      byteOffset: 100
      startPosition:
        line: 10
        column: 9
    tokens:
      - type: EvalStart
        content: '${{'
        offset: 100
        range: '10:10-10:12'
      - type: String
        content: '()'
        offset: 103
        range: '10:13-10:14'
      - type: EvalEnd
        content: '}}'
        offset: 105
        range: '10:15-10:16'
  # EOL
  eol-crlf:
    unquoteSource: true
    tokens:
      - type: String
        content: 'foo'
        offset: 0
        range: '1:1-1:3'
      - type: EOL
        rawContent: '\r\n'
        offset: 3
        range: '2:0-2:0'
      - type: String
        offset: 5
        content: 'bar'
        range: '2:1-2:3'

  # Errors
  err-bad-crlf:
    unquoteSource: true
    err:
      position: '2:0-2:0'
      offset: '3-3'
      err: 'broken CRLF - expected "\n" after "\r"'
  err-bad-crlf-multi:
    unquoteSource: true
    err:
      position: '2:0-2:0'
      offset: '3-5'
      err: 'broken CRLF - expected "\n" after "\r"'
  err-unterminated-eval:
    err:
      position: '1:11-1:16'
      offset: '10-15'
      err: 'unexpected end of input'
      note: 'missing "}}"'
  err-unterminated-nested:
    err:
      position: '1:12-1:20'
      offset: '11-19'
      err: 'unexpected end of input'
      note: 'missing "}}"'
  err-shell-in-shell:
    err:
      position: '1:3-1:4'
      offset: '2-3'
      err: 'unexpected token "$("'
      note: 'shell expression cannot contain another shell expression'
  err-shell-in-expr:
    err:
      position: '1:12-1:13'
      offset: '11-12'
      err: 'unexpected token "$("'
      note: 'eval expression cannot contain another expression'
  err-respect-doc-pos:
    doc:
      fileName: err-respect-doc-pos
      byteOffset: 100
      startPosition:
        line: 68
        column: 14
    err:
      err: 'unexpected token "${{"'
      note: 'eval expression cannot contain another expression'
      offset: '108-110'
      position: '68:23-68:25'